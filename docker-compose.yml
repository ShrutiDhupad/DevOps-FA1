services:
  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: fa2-backend
    image: fa2-backend:local
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=development
      - PORT=5000
    networks:
      - fa2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    container_name: fa2-frontend
    image: fa2-frontend:local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fa2-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  fa2-network:
    name: fa2-devops-network
    driver: bridge

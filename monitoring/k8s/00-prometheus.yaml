apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fa2-devops
  labels:
    app: prometheus
    app.kubernetes.io/part-of: fa2-devops
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: "fa2-backend"
        metrics_path: "/metrics"
        scrape_interval: 5s
        static_configs:
          - targets: ["backend:5000"]
            labels:
              app: "fa2-backend"
              env: "k8s-production"
      - job_name: "prometheus"
        scrape_interval: 10s
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: fa2-devops
  labels:
    app: prometheus
    app.kubernetes.io/part-of: fa2-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fa2-devops
  labels:
    app: prometheus
    app.kubernetes.io/part-of: fa2-devops
spec:
  type: NodePort
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
  selector:
    app: prometheus

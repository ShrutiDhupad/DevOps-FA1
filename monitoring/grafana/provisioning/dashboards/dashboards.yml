apiVersion: 1

providers:
  - name: 'FA2 Observability Dashboards'
    orgId: 1
    folder: 'DevOps Assessment'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true

<!DOCTYPE html>
<html>
<head>
    <title>DevOps FA1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>DevOps FA1 Application</h1>

    <p>Frontend container is running.</p>

    <button onclick="callBackend()">
        Test Backend API
    </button>

    <div id="result"></div>

</div>

<script>

async function callBackend() {

    try {

        const response = await fetch("/api/hello");

        const data = await response.json();

        document.getElementById("result").innerHTML =
            data.message + "<br>Environment: " + data.environment;

    } catch (error) {

        document.getElementById("result").innerHTML =
            "Backend connection failed.";

    }

}

</script>

</body>
</html>
